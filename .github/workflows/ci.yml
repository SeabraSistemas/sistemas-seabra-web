name: CI

# Restaura o gate de `gh pr checks` -> merge automatico para PRs.
# Ate agora o repo nao tinha CI; a vitrine /criadores usa branch + PR + preview,
# entao o merge automatico so faz sentido com lint + build verdes.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          # Build nao depende de rede; generateStaticParams tem catch -> [].
          # As envs reais (NEXT_PUBLIC_SUPABASE_URL / SUPABASE_ANON_KEY) vivem na Vercel.
          NEXT_TELEMETRY_DISABLED: '1'
